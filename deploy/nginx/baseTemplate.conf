# baseTemplate 的 nginx 反向代理配置
#
# 本文件由 deploy/deploy.sh 渲染：__NGINX_PORT__ / __SERVER_NAME__ /
# __APP_HOST__ / __APP_PORT__ 四个占位符会被替换为实际值。
# 也可以手工复制到 /etc/nginx/conf.d/ 后自行替换占位符。
#
# 职责划分：nginx 只做反向代理与压缩，静态文件由 127.0.0.1:__APP_PORT__
# 上的 scripts/serve.mjs 提供，便于单独重启前端而不影响 nginx。

server {
    listen __NGINX_PORT__;
    server_name __SERVER_NAME__;

    # 上传/导出类请求的体积上限，按需调整
    client_max_body_size 20m;

    # 压缩由 nginx 统一处理（proxied 必须打开，否则代理响应不压缩）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    access_log /var/log/nginx/baseTemplate.access.log;
    error_log  /var/log/nginx/baseTemplate.error.log warn;

    # 健康检查不写访问日志，方便监控轮询
    location = /healthz {
        proxy_pass http://__APP_HOST__:__APP_PORT__/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://__APP_HOST__:__APP_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 当前前端不依赖 WebSocket；如后续接入长连接，改用 http 级 map 设置
        # Upgrade/Connection 头，避免影响与上游的 keepalive。

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
