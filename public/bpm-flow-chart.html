<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>流程图 · 流程示例</title>
    <style>
      :root {
        color-scheme: light;
        --color-primary: #008ee0;
        --color-text-1: #333333;
        --color-text-2: #666666;
        --color-text-3: #98a2b3;
        --color-bg-1: #fafafa;
        --color-bg-white: #ffffff;
        --color-border-soft: #e8e8e8;
        --color-processing-bg: #e6f7ff;
        --color-processing-border: #91d5ff;
        --radius-md: 4px;
        --font-family-base: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei',
          Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        color: var(--color-text-1);
        background: var(--color-bg-1);
        font-family: var(--font-family-base);
        font-size: 14px;
        line-height: 1.6;
      }

      .chart-title {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
      }

      .chart-hint {
        margin: 0 0 20px;
        color: var(--color-text-3);
        font-size: 12px;
      }

      .chart {
        display: flex;
        align-items: stretch;
        gap: 8px;
        flex-wrap: wrap;
        padding: 20px;
        border: 1px solid var(--color-border-soft);
        border-radius: var(--radius-md);
        background: var(--color-bg-white);
      }

      .node {
        flex: 1 1 160px;
        min-width: 140px;
        padding: 12px 14px;
        border: 1px solid var(--color-border-soft);
        border-radius: var(--radius-md);
        background: var(--color-bg-1);
      }

      .node--active {
        border-color: var(--color-processing-border);
        background: var(--color-processing-bg);
      }

      .node__name {
        margin: 0 0 2px;
        font-weight: 600;
      }

      .node__meta {
        margin: 0;
        color: var(--color-text-2);
        font-size: 12px;
      }

      .arrow {
        align-self: center;
        color: var(--color-text-3);
        font-size: 18px;
      }

      .chart-note {
        margin: 16px 0 0;
        color: var(--color-text-2);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1 class="chart-title">费用申请审批流程</h1>
    <p class="chart-hint">原型占位：真实项目由 BPM 平台的流程图页面渲染，这里按示例流程定义静态展示。</p>
    <div class="chart">
      <div class="node">
        <p class="node__name">发起申请</p>
        <p class="node__meta">申请人</p>
      </div>
      <span class="arrow">→</span>
      <div class="node node--active">
        <p class="node__name">部门审批</p>
        <p class="node__meta">李审批 · 财务部</p>
      </div>
      <span class="arrow">→</span>
      <div class="node">
        <p class="node__name">财务审批</p>
        <p class="node__meta">王明 · 财务部</p>
      </div>
      <span class="arrow">→</span>
      <div class="node">
        <p class="node__name">结束</p>
        <p class="node__meta">流程归档</p>
      </div>
    </div>
    <p class="chart-note">流程状态、待办与审批历史由 src/mocks/bpm.ts 的契约模拟维护。</p>
  </body>
</html>
